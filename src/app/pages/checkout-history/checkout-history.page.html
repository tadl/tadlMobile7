<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/account"></ion-back-button>
    </ion-buttons>

    <ion-title>Checkout History</ion-title>

    <ion-buttons slot="end">
      <ion-menu-button menu="main"></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  @if (items.length > 0) {
  <ion-list lines="full" class="full-list">
    @for (i of items; track trackByItem($index, i)) {
    <ion-item button (click)="openItem(i)">
      @if (coverUrl(i)) {
      <ion-thumbnail slot="start">
        <img
          [src]="coverUrl(i)"
          alt=""
          (error)="$event.target.style.display='none'"
        />
      </ion-thumbnail>
      }
      <ion-label class="ion-text-wrap">
        <div class="result-title">
          <ion-icon
            [name]="mediaIconNameForHistoryItem(i)"
            aria-hidden="true"
          ></ion-icon>
          <span class="title">{{ titleText(i) }}</span>
        </div>
        @if (authorText(i)) {
        <div class="sub">{{ authorText(i) }}</div>
        } @if (whenText(i)) {
        <ion-note class="meta">{{ whenText(i) }}</ion-note>
        }
      </ion-label>
    </ion-item>
    }
  </ion-list>
  } @if (!loading && items.length === 0) {
  <ion-item>
    <ion-label class="ion-text-wrap">
      No checkout history available.
    </ion-label>
  </ion-item>
  }

  <ion-infinite-scroll
    threshold="100px"
    [disabled]="infiniteDisabled"
    (ionInfinite)="loadMore($event)"
  >
    <ion-infinite-scroll-content
      loadingSpinner="bubbles"
      loadingText="Loading more history..."
    >
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
