<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="close()">Close</ion-button>
    </ion-buttons>
    <ion-title>Newsletter</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card class="news-card">
    @if (shouldShowHero()) {
    <img [src]="heroImage()!" [alt]="titleFor()" class="hero" />
    }

    <ion-card-header>
      <ion-card-title class="title">{{ titleFor() }}</ion-card-title>
      @if (dateFor()) {
      <ion-card-subtitle class="meta">{{ dateFor() }}</ion-card-subtitle>
      }
    </ion-card-header>

    <ion-card-content>
      @if (htmlContent()) {
      <div
        class="news-body prose"
        [innerHTML]="htmlContent()"
        (click)="handleBodyLinkClick($event)"
      ></div>
      }
    </ion-card-content>
  </ion-card>

  @if (postUrl()) {
  <div class="browser-link-wrap">
    <ion-button
      class="browser-link-button"
      expand="block"
      (click)="openLink(postUrl()!)"
    >
      View in browser
    </ion-button>
  </div>
  }
</ion-content>
