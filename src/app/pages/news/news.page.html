<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>

    <ion-title>Newsletter</ion-title>

    <ion-buttons slot="end">
      <ion-menu-button menu="main"></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher
    slot="fixed"
    (ionRefresh)="get_news(); $event.target.complete()"
  >
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-list>
    @for (n of newsletters; track n) {
    <ion-item button detail="true" (click)="view_details(n)">
      <ion-thumbnail slot="start">
        <ion-img
          [src]="thumbFor(n)"
          [alt]="titleFor(n)"
          (ionError)="markImageBroken(n)"
        ></ion-img>
      </ion-thumbnail>
      <ion-label>
        <h2 [innerText]="titleFor(n)"></h2>
        @if (dateFor(n)) {
        <p class="muted">{{ dateFor(n) }}</p>
        } @if (excerptFor(n)) {
        <p class="muted">{{ excerptFor(n) }}</p>
        }
      </ion-label>
    </ion-item>
    }
  </ion-list>

  @if (!globals.api_loading && newsletters.length === 0) {
  <ion-item>
    <ion-label>No newsletters found.</ion-label>
  </ion-item>
  }
</ion-content>
